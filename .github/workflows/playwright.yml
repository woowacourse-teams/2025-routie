name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/playwright.config.ts'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/playwright.config.ts'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 22.20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env.dev
        run: |
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL_DEV }}" >> .env.dev
          echo "REACT_APP_GA4_MEASUREMENT_ID=${{ secrets.REACT_APP_GA4_MEASUREMENT_ID }}" >> .env.dev
          echo "REACT_APP_SENTRY_DSN=${{ secrets.REACT_APP_SENTRY_DSN }}" >> .env.dev
          echo "REACT_APP_KAKAO_MAP_APPKEY=${{ secrets.REACT_APP_KAKAO_MAP_APPKEY }}" >> .env.dev

      - name: Run Playwright tests
        run: npm run e2e
        env:
          E2E_ACCESS_TOKEN: ${{ secrets.E2E_ACCESS_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
